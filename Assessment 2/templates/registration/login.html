{% extends "base.html" %}

{% block title %}Login – Species Call Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title mb-4 text-center">Sign In</h2>

                {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid username or password. Please try again.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">Username</label>
                        <input type="text"
                               name="{{ form.username.html_name }}"
                               id="{{ form.username.id_for_label }}"
                               class="form-control"
                               autofocus
                               autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">Password</label>
                        <input type="password"
                               name="{{ form.password.html_name }}"
                               id="{{ form.password.id_for_label }}"
                               class="form-control"
                               autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-success w-100">Sign In</button>
                </form>

                <hr class="my-3">
                <p class="text-center mb-0 text-muted">
                    Don't have an account? <a href="{% url 'blog_app:register' %}">Create one</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
